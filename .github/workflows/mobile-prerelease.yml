name: iOS continuous prerelease

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ios-continuous-prerelease
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate shared iOS model catalogue
        run: ./gradlew -PiosCatalogOnly=true :shared:exportIosModelCatalog
      - name: Prepare iOS resources
        run: bash scripts/prepare-ios-resources.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build unsigned iOS Simulator app
        working-directory: iosApp
        run: |
          xcodebuild -project audiobookreader.xcodeproj \
            -scheme audiobookreader \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package iOS Simulator app
        working-directory: iosApp
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/audiobookreader.app ../audiobookreader-ios-simulator-debug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: audiobookreader-ios-simulator-debug
          path: audiobookreader-ios-simulator-debug.zip
      - name: Replace continuous prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-debug --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release delete ios-debug --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create ios-debug \
            audiobookreader-ios-simulator-debug.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "iOS debug · ${GITHUB_SHA::7}" \
            --notes "Automated unsigned debug build for the iOS Simulator. PocketTTS is intentionally excluded from iOS." \
            --prerelease
